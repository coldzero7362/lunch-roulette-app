# 개발 환경
#   https://lunch.158-247-240-171.sslip.io  (Caddy 프록시: ~/infra/proxy, 위치 권한은 여기서만 동작)
#   http://<서버IP>:8001                    (직접 접속)
#
#   docker compose up -d --build
#   docker compose exec -u www-data app php artisan ...
#   docker compose exec -u www-data app npm run build   # CSS/JS 변경 후
services:
  app:
    build: ./docker
    image: lunch-roulette-dev
    container_name: lunch-roulette
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www/html   # 코드 수정 즉시 반영
    networks: [default, proxy]

networks:
  proxy:
    external: true   # ~/infra/proxy 의 Caddy 와 공유
